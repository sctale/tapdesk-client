# Fork-only Android build: one ABI (arm64-v8a), steps copied 1:1 from
# upstream's build-rustdesk-android job in flutter-build.yml, minus the other
# platforms. Bridge files come from upstream's bridge.yml (same pinned
# flutter_rust_bridge_codegen), because generated_bridge.dart and
# src/bridge_generated.rs are gitignored and must be regenerated.
name: Custom Android client

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'Target ABI'
        type: choice
        default: 'aarch64-linux-android'
        options:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
  # Same build, fired from the CLI without the Actions tab:
  #   gh api -X POST repos/<owner>/<repo>/dispatches \
  #      -f event_type=build-android -f client_payload[abi]=aarch64-linux-android
  # Fresh repos only register a workflow after its first run, so a
  # workflow_dispatch-only file cannot be dispatched yet; this event does not
  # need that registration.
  repository_dispatch:
    types: [build-android]

env:
  ABI: ${{ github.event.client_payload.abi || github.event.inputs.abi || 'aarch64-linux-android' }}
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # Mirrors upstream line 54: step conditions like `env.ANDROID_SIGNING_KEY != null`
  # only see secrets once they are promoted into the workflow env.
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android:
    needs: [generate-bridge]
    # `env` is not available in a job name, so repeat the resolution here.
    name: build apk ${{ github.event.client_payload.abi || github.event.inputs.abi || 'aarch64-linux-android' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               tree \
               wget \
               python3 \
               python3-pip

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
          cache: true

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
            PATCH=${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
            # flutter-action's cache restores the SDK directory as it looked when
            # the previous job finished, patch included, so applying it again
            # fails. Skip instead when it is already in place.
            if git apply --reverse --check "$PATCH" 2>/dev/null; then
              echo "flutter patch already present in the cached SDK, skipping"
            else
              git apply "$PATCH"
            fi
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      # Empty custom client config means "behave like upstream". Committing the
      # signed payload would put our server/branding choices in a public repo,
      # so the key lives only in CI (CUSTOM_CLIENT_SIGN_KEY) and on the build box.
      - name: Materialize custom client config
        env:
          CUSTOM_CLIENT_SIGN_KEY: ${{ secrets.CUSTOM_CLIENT_SIGN_KEY }}
        run: |
          mkdir -p flutter/lib/brand
          if [ -n "$CUSTOM_CLIENT_SIGN_KEY" ]; then
            python3 -m pip install --quiet pynacl
            mkdir -p build-custom/keys
            printf '%s\n' "$CUSTOM_CLIENT_SIGN_KEY" > build-custom/keys/sign.key
            python3 build-custom/gen_custom_client.py
          else
            echo "CUSTOM_CLIENT_SIGN_KEY not set: building without a custom-client preset"
            printf '// Generated: no signing secret available, behave like upstream.\nconst String kCustomClientConfig =\n    "";\n' > flutter/lib/brand/custom_client_config.dart
          fi

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          case "${{ env.ABI }}" in
            aarch64-linux-android) ANDROID_TARGET=arm64-v8a ;;
            armv7-linux-androideabi) ANDROID_TARGET=armeabi-v7a ;;
            x86_64-linux-android) ANDROID_TARGET=x86_64 ;;
          esac
          if ! ./flutter/build_android_deps.sh "${ANDROID_TARGET}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.ABI }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android
          key: ${{ env.ABI }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ env.ABI }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          case "${{ env.ABI }}" in
            aarch64-linux-android)
              ./flutter/ndk_arm64.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
              cp ./target/${{ env.ABI }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
            ;;
            armv7-linux-androideabi)
              ./flutter/ndk_arm.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a
              cp ./target/${{ env.ABI }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
            ;;
            x86_64-linux-android)
              ./flutter/ndk_x64.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64
              cp ./target/${{ env.ABI }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so
            ;;
          esac

      - name: Build apk
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          case "${{ env.ABI }}" in
            aarch64-linux-android)
              TARGET_PLATFORM=android-arm64
              OUT=app-arm64-v8a-release.apk
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
            ;;
            armv7-linux-androideabi)
              TARGET_PLATFORM=android-arm
              OUT=app-armeabi-v7a-release.apk
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/
            ;;
            x86_64-linux-android)
              TARGET_PLATFORM=android-x64
              OUT=app-x86_64-release.apk
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86_64/
            ;;
          esac
          if [ ! -f ./flutter/android/key.properties ]; then
            # Same fallback upstream uses when no release keystore is configured.
            sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          fi
          pushd flutter
          flutter build apk --release --target-platform $TARGET_PLATFORM --split-per-abi
          mv build/app/outputs/flutter-apk/$OUT ../app-release.apk
          popd

      - name: Upload apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-${{ env.ABI }}
          path: app-release.apk

      - name: Setup sign tool version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "ANDROID_SIGN_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo "Last build tool version is: $BUILD_TOOL_VERSION"

      # Upstream signs with r0adkll/sign-android-release from secrets; the same
      # four secrets work here. Without them the artifact above is debug-signed,
      # which still installs fine on your own devices.
      - name: Sign app APK
        if: env.ANDROID_SIGNING_KEY != null
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        with:
          releaseDirectory: ${{ github.workspace }}
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}

      - name: Upload signed apk
        if: env.ANDROID_SIGNING_KEY != null
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-${{ env.ABI }}-signed
          path: app-release-signed.apk
